<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sticky Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
============================================================ */
:root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;

    --bg: #f6f5f1;
    --text: #1f2328;
    --muted: #767b83;
    --line: #e2e0d9;
    --line-strong: #cfccc3;
    --accent: #4b58d6;
    --drop: rgba(75, 88, 214, .06);
    --field: #ffffff;

    --shadow: 0 1px 1px rgba(40, 35, 20, .08), 0 10px 18px -8px rgba(40, 35, 20, .3);
    --shadow-lift: 0 2px 3px rgba(40, 35, 20, .12), 0 26px 44px -12px rgba(40, 35, 20, .45);

    --ctl-bg: rgba(0, 0, 0, .06);
    --ctl-border: rgba(0, 0, 0, .14);

    --yellow-bg: #fbf0b4;  --yellow-fg: #4a4118;  --sw-yellow: #e6cd4a;
    --blue-bg:   #d1e5f3;  --blue-fg:   #1f394c;  --sw-blue:   #6fa5cf;
    --green-bg:  #d4ebd8;  --green-fg:  #1f4029;  --sw-green:  #6db283;
    --purple-bg: #e3daf3;  --purple-fg: #392d56;  --sw-purple: #9c84d0;
    --red-bg:    #f7d4d7;  --red-fg:    #58292f;  --sw-red:    #da808b;
    --gray-bg:   #e6e6e2;  --gray-fg:   #33373c;  --sw-gray:   #a4a8ae;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;

        --bg: #0d0f12;
        --text: #f1f3f5;
        --muted: #8b929c;
        --line: #23272e;
        --line-strong: #363c46;
        --accent: #8b95ff;
        --drop: rgba(139, 149, 255, .07);
        --field: #15181d;

        --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 10px 20px -8px rgba(0, 0, 0, .6);
        --shadow-lift: 0 2px 3px rgba(0, 0, 0, .35), 0 28px 48px -12px rgba(0, 0, 0, .8);

        --ctl-bg: rgba(0, 0, 0, .18);
        --ctl-border: rgba(255, 255, 255, .12);

        --yellow-bg: #3d3a28;  --yellow-fg: #eee8c9;  --sw-yellow: #817846;
        --blue-bg:   #293743;  --blue-fg:   #dce9f2;  --sw-blue:   #526f85;
        --green-bg:  #29392f;  --green-fg:  #dce9df;  --sw-green:  #52745e;
        --purple-bg: #352f40;  --purple-fg: #e6def0;  --sw-purple: #725f82;
        --red-bg:    #3e2e31;  --red-fg:    #f0dfe1;  --sw-red:    #80545c;
        --gray-bg:   #30343a;  --gray-fg:   #e5e7ea;  --sw-gray:   #737981;
    }
}

:root[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0d0f12;
    --text: #f1f3f5;
    --muted: #8b929c;
    --line: #23272e;
    --line-strong: #363c46;
    --accent: #8b95ff;
    --drop: rgba(139, 149, 255, .07);
    --field: #15181d;

    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 10px 20px -8px rgba(0, 0, 0, .6);
    --shadow-lift: 0 2px 3px rgba(0, 0, 0, .35), 0 28px 48px -12px rgba(0, 0, 0, .8);

    --ctl-bg: rgba(0, 0, 0, .18);
    --ctl-border: rgba(255, 255, 255, .12);

    --yellow-bg: #3d3a28;  --yellow-fg: #eee8c9;  --sw-yellow: #817846;
    --blue-bg:   #293743;  --blue-fg:   #dce9f2;  --sw-blue:   #526f85;
    --green-bg:  #29392f;  --green-fg:  #dce9df;  --sw-green:  #52745e;
    --purple-bg: #352f40;  --purple-fg: #e6def0;  --sw-purple: #725f82;
    --red-bg:    #3e2e31;  --red-fg:    #f0dfe1;  --sw-red:    #80545c;
    --gray-bg:   #30343a;  --gray-fg:   #e5e7ea;  --sw-gray:   #737981;
}

/* ============================================================
   BASE
============================================================ */
*, *::before, *::after { box-sizing: inherit; }

html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;

    background: var(--bg);
    color: var(--text);
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
}

body.is-dragging {
    user-select: none;
    -webkit-user-select: none;
    cursor: grabbing;
}

button { font: inherit; }

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ============================================================
   TOOLBAR
============================================================ */
.toolbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 32px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
}

.brand svg { display: block; }

.brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -.01em;
}

.composer {
    flex: 1;
    display: flex;
    gap: 8px;
    max-width: 480px;
    margin-left: auto;
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;

    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 8px;

    font: inherit;
}

.composer input::placeholder { color: var(--muted); }

.composer button {
    padding: 0 16px;

    background: var(--text);
    color: var(--bg);
    border: 0;
    border-radius: 8px;

    font-weight: 600;
    cursor: pointer;
}

.composer button:hover { opacity: .88; }

/* Show completed switch */
.switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 6px 4px;

    background: none;
    border: 0;
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
}

.switch-track {
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--line-strong);
    transition: background .18s;
}

.switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    transition: transform .18s;
}

.switch[aria-checked="true"] .switch-track { background: var(--accent); }
.switch[aria-checked="true"] .switch-thumb { transform: translateX(14px); }

.switch-count {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}
.switch-count:empty { display: none; }

/* ============================================================
   BOARD — two open halves, one hairline between them
============================================================ */
.board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border-top: 1px solid var(--line);
}

.column {
    display: flex;
    flex-direction: column;
    min-width: 0;
    transition: background .15s;
}

.column + .column { border-left: 1px solid var(--line); }

.column.drop-target { background: var(--drop); }

.column-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 32px 0;
}

.column-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.005em;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line-strong);
}
.column[data-col="progress"] .dot { background: var(--accent); }

.count {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
}

.notes {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    align-items: start;
    align-content: start;
    gap: 22px;
    padding: 22px 32px 64px;
}

.empty {
    grid-column: 1 / -1;
    margin: 36px 0 0;
    color: var(--muted);
    max-width: 30ch;
}

.notes:has(.note-placeholder) .empty { display: none; }

/* ============================================================
   NOTE
============================================================ */
.note {
    --n-bg: var(--yellow-bg);
    --n-fg: var(--yellow-fg);

    position: relative;
    padding: 12px 16px 14px;

    background: var(--n-bg);
    color: var(--n-fg);
    border-radius: 3px;
    box-shadow: var(--shadow);

    transform: rotate(var(--tilt, 0deg));
    transition: transform .18s ease, box-shadow .18s ease;

    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
}

.note.yellow { --n-bg: var(--yellow-bg); --n-fg: var(--yellow-fg); }
.note.blue   { --n-bg: var(--blue-bg);   --n-fg: var(--blue-fg); }
.note.green  { --n-bg: var(--green-bg);  --n-fg: var(--green-fg); }
.note.purple { --n-bg: var(--purple-bg); --n-fg: var(--purple-fg); }
.note.red    { --n-bg: var(--red-bg);    --n-fg: var(--red-fg); }
.note.gray   { --n-bg: var(--gray-bg);   --n-fg: var(--gray-fg); }

.note:hover {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: var(--shadow-lift);
}

.note.dragging {
    position: fixed;
    z-index: 1000;
    margin: 0;
    transform: rotate(2.5deg) scale(1.03);
    box-shadow: var(--shadow-lift);
    cursor: grabbing;
    transition: none;
}

.note-placeholder {
    border: 1.5px dashed var(--line-strong);
    border-radius: 3px;
    background: var(--drop);
}

.note-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 -6px 8px -8px;
}

.grip {
    display: grid;
    place-items: center;
    flex: none;
    width: 22px;
    height: 26px;
    opacity: .4;
    cursor: grab;
    touch-action: none;
}
.note:hover .grip { opacity: .75; }

.note-title {
    flex: 1;
    min-width: 0;
    padding: 2px 0;

    background: transparent;
    border: 0;
    outline: none;
    color: inherit;

    font: inherit;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.005em;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
}

.note-title:focus { box-shadow: 0 1px 0 currentColor; }
.note.all-done .note-title { opacity: .55; }

.icon-btn {
    display: grid;
    place-items: center;
    flex: none;
    width: 24px;
    height: 24px;
    padding: 0;

    background: transparent;
    border: 0;
    border-radius: 6px;
    color: inherit;
    opacity: .4;
    cursor: pointer;
}
.icon-btn:hover { opacity: 1; background: var(--ctl-bg); }

/* Tasks */
.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task {
    display: flex;
    align-items: flex-start;
    gap: 9px;
}

.task input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    display: grid;
    place-content: center;
    flex: none;
    width: 16px;
    height: 16px;
    margin: 2px 0 0;

    background: transparent;
    border: 1.5px solid currentColor;
    border-radius: 4px;
    opacity: .55;
    cursor: pointer;
}

.task input[type="checkbox"]:checked {
    background: currentColor;
    opacity: 1;
}

.task input[type="checkbox"]:checked::after {
    content: "";
    width: 8px;
    height: 4px;
    border-left: 2px solid var(--n-bg);
    border-bottom: 2px solid var(--n-bg);
    transform: rotate(-45deg) translate(1px, -1px);
}

.task-text {
    flex: 1;
    min-width: 0;
    outline: none;
    word-break: break-word;
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .5;
}

.task .icon-btn { width: 20px; height: 20px; opacity: 0; }
.task:hover .icon-btn,
.task .icon-btn:focus-visible { opacity: .5; }
.task .icon-btn:hover { opacity: 1; }

@media (hover: none) {
    .task .icon-btn { opacity: .35; }
}

/* Add task */
.add-task {
    display: flex;
    gap: 6px;
    margin-top: 14px;
}

.add-task input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;

    background: var(--ctl-bg);
    border: 1px solid var(--ctl-border);
    border-radius: 5px;
    color: inherit;

    font: inherit;
    font-size: 13px;
    user-select: text;
    -webkit-user-select: text;
}

.add-task input::placeholder { color: inherit; opacity: .55; }

.add-task button {
    width: 28px;
    background: var(--ctl-bg);
    border: 1px solid var(--ctl-border);
    border-radius: 5px;
    color: inherit;
    cursor: pointer;
}
.add-task button:hover { background: var(--ctl-border); }

/* Footer: colours + progress */
.note-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
}

.swatches { display: flex; gap: 6px; }

.sw {
    width: 14px;
    height: 14px;
    padding: 0;

    border: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18);
    cursor: pointer;
    transition: transform .12s;
}
.sw:hover { transform: scale(1.2); }
.sw.current { box-shadow: 0 0 0 2px var(--n-bg), 0 0 0 3.5px currentColor; }

.sw-yellow { background: var(--sw-yellow); }
.sw-blue   { background: var(--sw-blue); }
.sw-green  { background: var(--sw-green); }
.sw-purple { background: var(--sw-purple); }
.sw-red    { background: var(--sw-red); }
.sw-gray   { background: var(--sw-gray); }

.progress {
    font-size: 12px;
    opacity: .6;
    font-variant-numeric: tabular-nums;
}
.progress:empty { display: none; }

/* ============================================================
   TOAST
============================================================ */
.toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 2000;

    display: flex;
    align-items: center;
    gap: 14px;
    max-width: calc(100% - 32px);
    padding: 10px 12px 10px 16px;

    background: var(--text);
    color: var(--bg);
    border-radius: 10px;
    box-shadow: var(--shadow-lift);

    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity .18s, transform .18s;
}

.toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
}

.toast button {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 6px;
    color: inherit;
    font-weight: 600;
    cursor: pointer;
}

/* ============================================================
   NARROW SCREENS — halves stack, everything still draggable
============================================================ */
@media (max-width: 760px) {
    .toolbar {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 18px;
    }

    .brand { order: 1; }
    .switch { order: 2; margin-left: auto; }
    .composer { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }

    .board { grid-template-columns: minmax(0, 1fr); }
    .column { min-height: 220px; }
    .column + .column { border-left: 0; border-top: 1px solid var(--line); }

    .column-head { padding: 18px 18px 0; }
    .notes { padding: 18px 18px 40px; gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<header class="toolbar">
    <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <path d="M3 3h20v13l-7 7H3z" fill="var(--sw-yellow)"/>
            <path d="M23 16l-7 7v-5a2 2 0 0 1 2-2z" fill="rgba(0,0,0,.22)"/>
            <path d="M7.5 9h11M7.5 13h7" stroke="rgba(0,0,0,.45)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <h1>Sticky Notes</h1>
    </div>

    <div class="composer">
        <input id="newNoteTitle" type="text" placeholder="New note title" maxlength="80" aria-label="New note title" autocomplete="off">
        <button id="addNote" type="button">Add note</button>
    </div>

    <button class="switch" id="toggleCompleted" type="button" role="switch" aria-checked="true">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span>Show completed</span>
        <span class="switch-count" id="doneCount"></span>
    </button>
</header>

<main class="board" id="board">
    <section class="column" data-col="todo" aria-labelledby="h-todo">
        <div class="column-head">
            <span class="dot"></span>
            <h2 id="h-todo">To do</h2>
            <span class="count" id="todoCount">0</span>
        </div>
        <div class="notes" id="todo" data-col="todo"></div>
    </section>

    <section class="column" data-col="progress" aria-labelledby="h-progress">
        <div class="column-head">
            <span class="dot"></span>
            <h2 id="h-progress">In progress</h2>
            <span class="count" id="progressCount">0</span>
        </div>
        <div class="notes" id="progress" data-col="progress"></div>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============================================================
   STATE + STORAGE
============================================================ */
const STORE_KEY  = 'stickyNotes.v2';
const LEGACY_KEY = 'stickyNotes';
const PREFS_KEY  = 'stickyNotes.prefs';

const COLORS  = ['yellow', 'blue', 'green', 'purple', 'red', 'gray'];
const COLUMNS = ['todo', 'progress'];

let notes = [];
let prefs = { showCompleted: true };
let pendingFocus = null;
let storageWarned = false;

const $ = (sel, root = document) => root.querySelector(sel);

const colEls   = { todo: $('.column[data-col="todo"]'),     progress: $('.column[data-col="progress"]') };
const listEls  = { todo: $('#todo'),                        progress: $('#progress') };
const countEls = { todo: $('#todoCount'),                   progress: $('#progressCount') };
const toggleEl = $('#toggleCompleted');
const doneEl   = $('#doneCount');
const inputEl  = $('#newNoteTitle');

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function normalizeNote(n) {
    if (!n || typeof n !== 'object') return null;
    return {
        id: String(n.id || uid()),
        title: String(n.title || 'Untitled'),
        color: COLORS.includes(n.color) ? n.color : 'yellow',
        column: COLUMNS.includes(n.column) ? n.column : 'todo',
        tasks: Array.isArray(n.tasks)
            ? n.tasks.filter(t => t && typeof t === 'object').map(t => ({
                id: String(t.id || uid()),
                text: String(t.text ?? ''),
                completed: !!t.completed
            }))
            : []
    };
}

function load() {
    try {
        // Falls back to the previous version's key so existing notes carry over.
        const raw = localStorage.getItem(STORE_KEY) ?? localStorage.getItem(LEGACY_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) notes = parsed.map(normalizeNote).filter(Boolean);
        }
        const p = localStorage.getItem(PREFS_KEY);
        if (p) prefs = { ...prefs, ...JSON.parse(p) };
    } catch (e) {
        notes = [];
    }
}

function write(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
        if (!storageWarned) {
            storageWarned = true;
            toast("This browser is blocking storage, so your notes won't be kept after you close the tab.");
        }
    }
}

const save      = () => write(STORE_KEY, notes);
const savePrefs = () => write(PREFS_KEY, prefs);

/* ============================================================
   HELPERS
============================================================ */
function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    kids.forEach(k => e.append(k));
    return e;
}

const GRIP_SVG =
    '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true">' +
    '<circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/>' +
    '<circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/>' +
    '<circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg>';

const X_SVG =
    '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>';

// A stable, slight tilt per note so the board feels hand-placed.
function tiltFor(id) {
    let hash = 0;
    for (const c of id) hash = (hash * 31 + c.charCodeAt(0)) | 0;
    return (((hash % 5) + 5) % 5 - 2) * 0.4;
}

const isNoteDone  = n => n.tasks.length > 0 && n.tasks.every(t => t.completed);
const isNoteShown = n => prefs.showCompleted || !isNoteDone(n);

/* ============================================================
   TOAST
============================================================ */
let toastTimer = 0;
const toastEl = $('#toast');

function hideToast() { toastEl.classList.remove('show'); }

function toast(message, actionLabel, action) {
    toastEl.replaceChildren(message);
    if (actionLabel) {
        const b = h('button', { type: 'button' }, actionLabel);
        b.addEventListener('click', () => { action(); hideToast(); });
        toastEl.append(b);
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
}

/* ============================================================
   RENDER
============================================================ */
const EMPTY = {
    todo: 'Nothing planned yet. Add a note above.',
    progress: 'Drag a note here once you start on it.'
};

function render() {
    COLUMNS.forEach(col => {
        const box  = listEls[col];
        const list = notes.filter(n => n.column === col && isNoteShown(n));

        box.replaceChildren(...list.map(buildNote));

        if (!list.length) {
            const hiddenHere = notes.some(n => n.column === col);
            box.append(h('p', { class: 'empty' },
                hiddenHere ? 'Everything here is completed. Turn on Show completed to see it.' : EMPTY[col]));
        }
        countEls[col].textContent = list.length;
    });

    const doneTasks = notes.reduce((sum, n) => sum + n.tasks.filter(t => t.completed).length, 0);
    toggleEl.setAttribute('aria-checked', String(prefs.showCompleted));
    doneEl.textContent = doneTasks ? String(doneTasks) : '';

    if (pendingFocus) {
        const input = $(`.note[data-id="${CSS.escape(pendingFocus)}"] .add-task input`);
        if (input) input.focus();
        pendingFocus = null;
    }
}

function buildNote(note) {
    const el = h('article', {
        class: `note ${note.color}${isNoteDone(note) ? ' all-done' : ''}`,
        'data-id': note.id
    });
    el.style.setProperty('--tilt', tiltFor(note.id) + 'deg');

    /* Head */
    const grip = h('div', { class: 'grip', title: 'Drag to move' });
    grip.innerHTML = GRIP_SVG;

    const title = h('input', {
        class: 'note-title', type: 'text', maxlength: '80',
        value: note.title, 'aria-label': 'Note title'
    });
    title.addEventListener('input', () => { note.title = title.value; save(); });
    title.addEventListener('blur', () => {
        if (!title.value.trim()) { title.value = 'Untitled'; note.title = 'Untitled'; save(); }
    });
    title.addEventListener('keydown', e => { if (e.key === 'Enter') title.blur(); });

    const del = h('button', { class: 'icon-btn', type: 'button', title: 'Delete note', 'aria-label': 'Delete note' });
    del.innerHTML = X_SVG;
    del.addEventListener('click', () => deleteNote(note.id));

    el.append(h('div', { class: 'note-head' }, grip, title, del));

    /* Tasks */
    const list = h('ul', { class: 'tasks' });
    note.tasks
        .filter(t => prefs.showCompleted || !t.completed)
        .forEach(t => list.append(buildTask(note, t)));
    el.append(list);

    /* Add task */
    const taskInput = h('input', { type: 'text', placeholder: 'Add a task', 'aria-label': 'Add a task', autocomplete: 'off' });
    const addBtn = h('button', { type: 'button', 'aria-label': 'Add task' }, '+');

    const addTask = () => {
        const value = taskInput.value.trim();
        if (!value) return;
        note.tasks.push({ id: uid(), text: value, completed: false });
        save();
        pendingFocus = note.id;
        render();
    };
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    addBtn.addEventListener('click', addTask);

    el.append(h('div', { class: 'add-task' }, taskInput, addBtn));

    /* Footer */
    const swatches = h('div', { class: 'swatches' });
    COLORS.forEach(color => {
        const b = h('button', {
            class: `sw sw-${color}${color === note.color ? ' current' : ''}`,
            type: 'button', title: color, 'aria-label': `Colour: ${color}`
        });
        b.addEventListener('click', () => { note.color = color; save(); render(); });
        swatches.append(b);
    });

    const done = note.tasks.filter(t => t.completed).length;
    const progress = h('span', { class: 'progress' },
        note.tasks.length ? `${done} of ${note.tasks.length} done` : '');

    el.append(h('div', { class: 'note-foot' }, swatches, progress));

    attachDrag(el, note);
    return el;
}

function buildTask(note, task) {
    const li = h('li', { class: `task${task.completed ? ' completed' : ''}` });

    const box = h('input', { type: 'checkbox', 'aria-label': 'Completed' });
    box.checked = task.completed;
    box.addEventListener('change', () => {
        task.completed = box.checked;
        save();
        render();
    });

    const text = h('span', { class: 'task-text', spellcheck: 'true' });
    text.textContent = task.text;
    text.contentEditable = 'true';

    let lastGood = task.text;
    text.addEventListener('input', () => {
        task.text = text.textContent;
        save();
    });
    text.addEventListener('blur', () => {
        const value = text.textContent.trim();
        if (!value) { text.textContent = lastGood; task.text = lastGood; }
        else { lastGood = value; task.text = value; }
        save();
    });
    text.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
    });
    text.addEventListener('paste', e => {
        e.preventDefault();
        const plain = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, plain);
    });

    const remove = h('button', { class: 'icon-btn', type: 'button', title: 'Delete task', 'aria-label': 'Delete task' });
    remove.innerHTML = X_SVG;
    remove.addEventListener('click', () => {
        note.tasks = note.tasks.filter(t => t.id !== task.id);
        save();
        render();
    });

    li.append(box, text, remove);
    return li;
}

/* ============================================================
   ACTIONS
============================================================ */
function createNote() {
    const title = inputEl.value.trim();
    if (!title) { inputEl.focus(); return; }

    const note = {
        id: uid(),
        title,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        column: 'todo',
        tasks: []
    };

    notes.unshift(note);
    save();
    inputEl.value = '';
    pendingFocus = note.id;
    render();
}

function deleteNote(id) {
    const index = notes.findIndex(n => n.id === id);
    if (index < 0) return;

    const [removed] = notes.splice(index, 1);
    save();
    render();

    toast('Note deleted', 'Undo', () => {
        notes.splice(Math.min(index, notes.length), 0, removed);
        save();
        render();
    });
}

$('#addNote').addEventListener('click', createNote);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') createNote(); });

toggleEl.addEventListener('click', () => {
    prefs.showCompleted = !prefs.showCompleted;
    savePrefs();
    render();
});

/* ============================================================
   DRAG — reorder inside a column or move to the other one
============================================================ */
function attachDrag(el, note) {
    let s = null;     // active gesture
    let raf = 0;

    // Next real note after `node`, ignoring the dragged card and the placeholder.
    const nextNote = node => {
        let n = node.nextElementSibling;
        while (n && (n === el || !n.classList.contains('note'))) n = n.nextElementSibling;
        return n;
    };

    function targetColumn(x, y) {
        let best = COLUMNS[0], bestDist = Infinity;
        for (const col of COLUMNS) {
            const r = colEls[col].getBoundingClientRect();
            const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
            const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
            const d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; best = col; }
        }
        return best;
    }

    // Which note should the placeholder sit in front of? null = the end.
    function insertionRef(box, x, y) {
        const items = [...box.querySelectorAll(':scope > .note')].filter(n => n !== el);
        if (!items.length) return null;

        let best = null, bestDist = Infinity;
        for (const n of items) {
            const r = n.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            const d = (x - cx) ** 2 + (y - cy) ** 2;
            if (d < bestDist) { bestDist = d; best = { n, r, cx, cy }; }
        }

        const oneAcross = best.r.width > box.clientWidth * 0.6;   // single-column layout
        const before = y < best.r.top ? true
                     : y > best.r.bottom ? false
                     : oneAcross ? y < best.cy
                     : x < best.cx;

        return before ? best.n : nextNote(best.n);
    }

    function updateDrop() {
        const col = targetColumn(s.x, s.y);
        COLUMNS.forEach(c => colEls[c].classList.toggle('drop-target', c === col));

        const box = listEls[col];
        const ref = insertionRef(box, s.x, s.y);
        if (s.ph.parentNode !== box || nextNote(s.ph) !== ref) box.insertBefore(s.ph, ref);
    }

    function loop() {
        if (!s || !s.active) return;

        // Scroll the page when the card is held near the top or bottom edge.
        const edge = 70, vh = window.innerHeight;
        if (s.y < edge) window.scrollBy(0, -Math.ceil((edge - s.y) / 5));
        else if (s.y > vh - edge) window.scrollBy(0, Math.ceil((s.y - (vh - edge)) / 5));

        updateDrop();
        raf = requestAnimationFrame(loop);
    }

    function begin() {
        const r = el.getBoundingClientRect();
        s.ox = s.sx - r.left;
        s.oy = s.sy - r.top;

        s.ph = h('div', { class: 'note-placeholder' });
        s.ph.style.height = r.height + 'px';
        el.parentNode.insertBefore(s.ph, el);

        el.style.width  = r.width + 'px';
        el.style.height = r.height + 'px';
        el.classList.add('dragging');
        document.body.classList.add('is-dragging');
        document.activeElement && document.activeElement.blur && document.activeElement.blur();

        s.active = true;
        raf = requestAnimationFrame(loop);
    }

    function finish(commit) {
        if (!s) return;
        cancelAnimationFrame(raf);
        const st = s;

        try { el.releasePointerCapture(st.pid); } catch (_) {}

        if (st.active) {
            if (commit) {
                updateDrop();
                const box = st.ph.parentNode;
                const col = box.dataset.col;
                const ref = nextNote(st.ph);

                notes = notes.filter(n => n !== note);
                note.column = col;

                const at = ref ? notes.findIndex(n => n.id === ref.dataset.id) : -1;
                if (at >= 0) notes.splice(at, 0, note); else notes.push(note);
                save();
            }
            COLUMNS.forEach(c => colEls[c].classList.remove('drop-target'));
            document.body.classList.remove('is-dragging');
        }

        s = null;
        if (st.active) render();
    }

    el.addEventListener('pointerdown', e => {
        if (e.button !== 0 || s) return;
        if (e.target.closest('input, button, .task-text')) return;

        // Touch drags start from the grip so the page can still scroll.
        const fromGrip = !!e.target.closest('.grip');
        if (e.pointerType === 'touch' && !fromGrip) return;

        s = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, active: false, ph: null, ox: 0, oy: 0 };
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });

    el.addEventListener('pointermove', e => {
        if (!s || e.pointerId !== s.pid) return;
        s.x = e.clientX;
        s.y = e.clientY;

        if (!s.active) {
            if (Math.hypot(s.x - s.sx, s.y - s.sy) < 5) return;
            begin();
        }

        el.style.left = (s.x - s.ox) + 'px';
        el.style.top  = (s.y - s.oy) + 'px';
    });

    el.addEventListener('pointerup',     e => { if (s && e.pointerId === s.pid) finish(true); });
    el.addEventListener('pointercancel', e => { if (s && e.pointerId === s.pid) finish(false); });
}

/* ============================================================
   INIT
============================================================ */
load();
render();

})();
</script>
</body>
</html>
